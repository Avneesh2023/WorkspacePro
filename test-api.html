<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkspacePro Auth API Tester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.5rem;
      color: #e2e8f0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input {
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 1rem;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .response-box {
      background-color: #090d16;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.875rem;
      min-height: 120px;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .status-success {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1>WorkspacePro API Tester</h1>
    <p class="subtitle">Quickly test your Register & Login endpoints without Postman</p>
  </header>

  <div class="container">
    <!-- Register Card -->
    <div class="card">
      <h2>1. Test Register API</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="regName">Name</label>
          <input type="text" id="regName" value="Rahul" required>
        </div>
        <div class="form-group" style="margin-top: 1rem;">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" value="rahul@example.com" required>
        </div>
        <div class="form-group" style="margin-top: 1rem;">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" value="123456" required>
        </div>
        <button type="submit" style="width: 100%; margin-top: 1.5rem;">Send POST /api/auth/register</button>
      </form>
      <div>
        <div id="regStatus" class="status-badge" style="display: none;"></div>
        <div id="regResponse" class="response-box">Response will appear here...</div>
      </div>
    </div>

    <!-- Login Card -->
    <div class="card">
      <h2>2. Test Login API</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" value="rahul@example.com" required>
        </div>
        <div class="form-group" style="margin-top: 1rem;">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" value="123456" required>
        </div>
        <button type="submit" style="width: 100%; margin-top: 1.5rem;">Send POST /api/auth/login</button>
      </form>
      <div>
        <div id="loginStatus" class="status-badge" style="display: none;"></div>
        <div id="loginResponse" class="response-box">Response will appear here...</div>
      </div>
    </div>
  </div>

  <script>
    const baseUrl = 'http://localhost:5000/api/auth';

    // Register Form Handler
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const responseBox = document.getElementById('regResponse');
      const statusBadge = document.getElementById('regStatus');

      responseBox.textContent = 'Sending request...';
      statusBadge.style.display = 'none';

      try {
        const res = await fetch(`${baseUrl}/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();
        statusBadge.style.display = 'inline-block';
        statusBadge.className = `status-badge ${res.ok ? 'status-success' : 'status-error'}`;
        statusBadge.textContent = `STATUS: ${res.status} ${res.statusText}`;
        responseBox.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        statusBadge.style.display = 'inline-block';
        statusBadge.className = 'status-badge status-error';
        statusBadge.textContent = 'ERROR';
        responseBox.textContent = `Failed to connect to the server at ${baseUrl}/register. Ensure your backend server is running on port 5000!\n\nError: ${error.message}`;
      }
    });

    // Login Form Handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const responseBox = document.getElementById('loginResponse');
      const statusBadge = document.getElementById('loginStatus');

      responseBox.textContent = 'Sending request...';
      statusBadge.style.display = 'none';

      try {
        const res = await fetch(`${baseUrl}/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        statusBadge.style.display = 'inline-block';
        statusBadge.className = `status-badge ${res.ok ? 'status-success' : 'status-error'}`;
        statusBadge.textContent = `STATUS: ${res.status} ${res.statusText}`;
        responseBox.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        statusBadge.style.display = 'inline-block';
        statusBadge.className = 'status-badge status-error';
        statusBadge.textContent = 'ERROR';
        responseBox.textContent = `Failed to connect to the server at ${baseUrl}/login. Ensure your backend server is running on port 5000!\n\nError: ${error.message}`;
      }
    });
  </script>
</body>
</html>
